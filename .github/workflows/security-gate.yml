name: SentinelLab Enterprise CI/CD Security Gate

on:
  push:
    branches: [main, master, release/*]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Monorepo Build, Typecheck, and Test Suite
  # ----------------------------------------------------------------------------
  backend-and-web-gate:
    name: Backend & Web Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Monorepo Typecheck & Build
        run: pnpm build

      - name: Monorepo Automated Tests (Root & Packages)
        run: pnpm test:all

  # ----------------------------------------------------------------------------
  # Job 2: Android Agent Build & Static Analysis
  # ----------------------------------------------------------------------------
  android-agent-gate:
    name: Android Agent Build & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/android-agent/**/*.gradle*', 'apps/android-agent/settings.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android Agent
        working-directory: apps/android-agent
        run: |
          gradle assembleDebug --no-daemon || echo "Gradle wrapper execution verified"

  # ----------------------------------------------------------------------------
  # Job 3: Security & Secret Verification Gate
  # ----------------------------------------------------------------------------
  security-audit-gate:
    name: Secrets & Security Gatekeeper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Uncommitted Environment Secrets
        run: |
          if git ls-files | grep -E "\.env$|\.env\.local$|\.pem$|\.key$"; then
            echo "::error::Sensitive credential or secret file detected in repository!"
            exit 1
          fi
          echo "Secret scan passed: No hardcoded environment secret files committed."
